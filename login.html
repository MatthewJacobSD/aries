<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <img src="images/auth-desk.jpg" alt="" />
        <div class="auth-visual-copy">
          <a class="logo" href="index.html">Aries</a>
          <h1>Return to the desk.</h1>
          <p>Sign in to the workspace that holds campaigns, revenue, and client rooms.</p>
        </div>
      </aside>
      <main class="auth-panel">
        <header>
          <p class="kicker">Account</p>
          <h2>Sign in</h2>
          <p class="lede">
            Use email or continue with a provider. This demo stores the session in your browser
            only.
          </p>
        </header>
        <div id="authAlert" class="alert" role="status"></div>
        <div class="socials">
          <button class="social" type="button" data-provider="google">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#ea4335"
                d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.8 0 3 .7 3.7 1.4l2.5-2.4C16.7 3.7 14.6 2.7 12 2.7 6.9 2.7 2.7 6.9 2.7 12S6.9 21.3 12 21.3c5.5 0 9.1-3.9 9.1-9.3 0-.6 0-1-.1-1.8H12z"
              />
            </svg>
            Continue with Google
          </button>
          <button class="social" type="button" data-provider="facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#1877f2"
                d="M14.5 8.5h2.2V5.4h-2.2C12.1 5.4 11 7 11 9.3V11H8.7v3.2H11V22h3.3v-7.8h2.3l.5-3.2H14.3V9.5c0-.6.2-1 .2-1z"
              />
            </svg>
            Continue with Facebook
          </button>
        </div>
        <div class="divider">or email</div>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn" type="submit">Sign in</button>
        </form>
        <p class="note">New here? <a href="register.html">Create an account</a></p>
      </main>
    </div>
    <script src="js/auth.js"></script>
  </body>
</html>
