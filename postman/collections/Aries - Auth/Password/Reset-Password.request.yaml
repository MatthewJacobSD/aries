$kind: http-request
name: 'Reset Password'
description: Reset password using a token from email.
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "new_password": "newpassword456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["message"],
          properties: {
            message: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
