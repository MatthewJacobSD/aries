$kind: http-request
name: Complete Onboarding
method: POST
url: '{{baseUrl}}/api/auth/complete-onboarding'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "full_name": "Jane Doe",
      "role": "creator"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Onboarding completed", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
      });
