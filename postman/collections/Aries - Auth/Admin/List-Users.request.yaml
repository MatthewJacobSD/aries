$kind: http-request
name: List Users
method: GET
url: '{{baseUrl}}/api/auth/users'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Returns array of users", () => {
        const json = pm.response.json();
        pm.expect(json).to.be.an("array");
      });
