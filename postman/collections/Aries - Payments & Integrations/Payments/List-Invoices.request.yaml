$kind: http-request
name: List Invoices
method: GET
url: '{{baseUrl}}/api/payments/invoices?page=1&limit=20'
order: 5000
description: List client invoices.
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
