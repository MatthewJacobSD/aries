$kind: http-request
name: Stripe Webhook
method: POST
url: '{{baseUrl}}/api/payments/webhook'
order: 7000
description: Stripe webhook endpoint for payment events.
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
  - key: Stripe-Signature
    value: '{{stripeSignature}}'
body:
  type: json
  content: |-
    {
      "type": "payment_intent.succeeded",
      "data": {
        "object": {
          "id": "pi_test_123",
          "amount": 500000,
          "currency": "usd"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
