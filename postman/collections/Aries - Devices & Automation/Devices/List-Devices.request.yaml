$kind: http-request
method: GET
url: '{{baseUrl}}/api/devices?page=1&limit=20&status=online'
description: 'List all registered devices in the phone farm.'
order: 1000
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
  - key: status
    value: online
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Returns device list", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("items");
        pm.expect(json.items).to.be.an("array");
      });
