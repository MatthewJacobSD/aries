$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/devices/{{deviceId}}/status'
description: 'Update the online/offline status of a device.'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "offline"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
