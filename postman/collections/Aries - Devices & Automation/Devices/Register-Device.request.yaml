$kind: http-request
method: POST
url: '{{baseUrl}}/api/devices'
description: 'Register a new phone farm device.'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Android-01",
      "platform": "android",
      "serial": "emulator-5554",
      "creator_id": "{{creatorId}}",
      "status": "online"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Device registered", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.collectionVariables.set("deviceId", json.id);
      });
