$kind: http-request
name: Get Creator Stats
method: GET
url: '{{baseUrl}}/api/creators/{{creatorId}}/stats'
description: Get revenue and performance stats for a creator.
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Returns stats", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("total_revenue");
      });
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["total_revenue"],
          properties: {
            total_revenue: { type: "number" },
            subscriber_count: { type: "number" },
            campaign_count: { type: "number" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
