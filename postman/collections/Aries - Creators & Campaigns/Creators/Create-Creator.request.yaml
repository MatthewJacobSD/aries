$kind: http-request
name: Create Creator
method: POST
url: '{{baseUrl}}/api/creators'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Alex Voss",
      "platform": "fanvue",
      "handle": "@alexvoss",
      "email": "alex@example.com",
      "revenue_share": 0.7,
      "status": "active"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Creator created", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.collectionVariables.set("creatorId", json.id);
      });
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["id", "name", "platform", "status"],
          properties: {
            id: { type: "string" },
            name: { type: "string" },
            platform: { type: "string" },
            handle: { type: "string" },
            email: { type: "string", format: "email" },
            revenue_share: { type: "number", minimum: 0, maximum: 1 },
            status: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
