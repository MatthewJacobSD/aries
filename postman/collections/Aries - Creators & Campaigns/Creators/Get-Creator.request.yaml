$kind: http-request
name: Get Creator
method: GET
url: '{{baseUrl}}/api/creators/{{creatorId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Returns creator", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("name");
      });
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["id", "name", "platform", "status"],
          properties: {
            id: { type: "string" },
            name: { type: "string" },
            platform: { type: "string" },
            handle: { type: "string" },
            email: { type: "string", format: "email" },
            revenue_share: { type: "number" },
            status: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
