$kind: http-request
name: Delete Creator
method: DELETE
url: '{{baseUrl}}/api/creators/{{creatorId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", () => pm.response.to.have.status(204));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Empty response body", () => pm.expect(pm.response.text()).to.be.empty);
