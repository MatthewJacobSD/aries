$kind: http-request
name: Get Client
method: GET
url: '{{baseUrl}}/api/clients/{{clientId}}'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["id", "name", "status"],
          properties: {
            id: { type: "string" },
            name: { type: "string" },
            contact_email: { type: "string" },
            industry: { type: "string" },
            status: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
