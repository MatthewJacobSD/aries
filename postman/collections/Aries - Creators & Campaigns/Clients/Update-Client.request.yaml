$kind: http-request
name: Update Client
method: PUT
url: '{{baseUrl}}/api/clients/{{clientId}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Acme Brand Co. (Updated)",
      "contact_email": "updated@acme.com",
      "industry": "fashion",
      "status": "active"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Client updated", () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("name");
      });
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["id", "name", "status"],
          properties: {
            id: { type: "string" },
            name: { type: "string" },
            contact_email: { type: "string" },
            industry: { type: "string" },
            status: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
