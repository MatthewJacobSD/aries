$kind: http-request
name: Update Task
method: PUT
url: '{{baseUrl}}/api/tasks/{{taskId}}'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "completed"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
      pm.test("Schema is valid", () => {
        const schema = {
          type: "object",
          required: ["id", "title", "status"],
          properties: {
            id: { type: "string" },
            title: { type: "string" },
            status: { type: "string" }
          }
        };
        pm.response.to.have.jsonSchema(schema);
      });
