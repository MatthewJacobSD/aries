$kind: http-request
name: Delete Task
method: DELETE
url: '{{baseUrl}}/api/tasks/{{taskId}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 204", () => pm.response.to.have.status(204));
      pm.test("Response time under 2000ms", () => pm.expect(pm.response.responseTime).to.be.below(2000));
