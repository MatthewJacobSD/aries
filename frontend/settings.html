<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>

  <body class="app">
    <header class="site">
      <a class="logo" href="index.html">Aries</a>

      <nav class="primary" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="settings.html" aria-current="page">Settings</a>
      </nav>
    </header>

    <div class="app-shell">
      <div class="dash settings-shell">
        <aside class="dash-side">
          <div class="mark">ARIES</div>

          <nav class="dash-nav" aria-label="Settings navigation">
            <a class="dash-nav-link" href="dashboard.html">Overview</a>
            <button class="active" type="button">Settings</button>
          </nav>
        </aside>

        <main class="dash-main">
          <div class="dash-top">
            <div>
              <h3>Settings</h3>
              <p class="subhead" id="workspaceName">Workspace</p>
            </div>
            <span class="live-dot" id="roleBadge"></span>
          </div>

          <section class="settings-section" aria-labelledby="profile-heading">
            <div class="settings-section-head">
              <div>
                <span class="kicker">Profile</span>
                <h3 id="profile-heading">Your account</h3>
              </div>
              <span class="settings-status" id="profileStatus">Loading...</span>
            </div>

            <form id="profileForm">
              <div class="settings-field">
                <label for="fullName">Full name</label>
                <input id="fullName" name="full_name" type="text" />
              </div>
              <div class="settings-field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" />
              </div>
              <button class="cta" type="submit" style="margin-top: 0.75rem">Save changes</button>
            </form>
          </section>

          <section class="settings-section" aria-labelledby="password-heading">
            <div class="settings-section-head">
              <div>
                <span class="kicker">Security</span>
                <h3 id="password-heading">Change password</h3>
              </div>
            </div>

            <form id="passwordForm">
              <div class="settings-field">
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" name="current_password" type="password" autocomplete="current-password" />
              </div>
              <div class="settings-field">
                <label for="newPassword">New password</label>
                <input id="newPassword" name="new_password" type="password" autocomplete="new-password" />
              </div>
              <button class="cta" type="submit" style="margin-top: 0.75rem">Change password</button>
            </form>
            <div id="passwordAlert" class="alert" role="status" style="margin-top: 0.75rem"></div>
          </section>

          <section class="settings-section" aria-labelledby="sessions-heading">
            <div class="settings-section-head">
              <div>
                <span class="kicker">Session</span>
                <h3 id="sessions-heading">Account actions</h3>
              </div>
            </div>
            <button class="cta" type="button" id="signOutBtn" style="border-color: rgba(229, 80, 80, 0.5); color: #e55;">Sign out</button>
          </section>
        </main>
      </div>
    </div>
    <script src="js/session.js"></script>
    <script>
      (function () {
        "use strict";
        const API_URL = "http://localhost:8000";
        const TOKEN_KEY = "aries_token";

        const api = async (endpoint, opts = {}) => {
          const token = localStorage.getItem(TOKEN_KEY);
          const headers = { "Content-Type": "application/json", ...opts.headers };
          if (token) { headers["Authorization"] = `Bearer ${token}`; }
          const res = await fetch(`${API_URL}${endpoint}`, { ...opts, headers });
          if (res.status === 401) { window.location.href = "login.html"; return null; }
          return res.json();
        };

        const showAlert = (el, type, text) => {
          if (!el) return;
          el.className = `alert show ${type}`;
          el.textContent = text;
        };

        const loadProfile = async () => {
          const user = await api("/api/auth/me");
          if (!user) return;
          document.getElementById("fullName").value = user.full_name || "";
          document.getElementById("email").value = user.email || "";
          document.getElementById("workspaceName").textContent = user.full_name || user.email;
          document.getElementById("roleBadge").textContent = user.role;
          document.getElementById("profileStatus").textContent = "Active";
        };

        document.getElementById("profileForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const body = {
            full_name: document.getElementById("fullName").value.trim(),
            email: document.getElementById("email").value.trim(),
          };
          const result = await api("/api/auth/me", { method: "PUT", body: JSON.stringify(body) });
          if (result && result.id) {
            const session = JSON.parse(localStorage.getItem("aries_session") || "{}");
            session.name = body.full_name;
            session.email = body.email;
            localStorage.setItem("aries_session", JSON.stringify(session));
            document.getElementById("profileStatus").textContent = "Saved";
            setTimeout(() => { document.getElementById("profileStatus").textContent = "Active"; }, 2000);
          }
        });

        document.getElementById("passwordForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const alertBox = document.getElementById("passwordAlert");
          const current = document.getElementById("currentPassword").value;
          const newPwd = document.getElementById("newPassword").value;
          if (newPwd.length < 8) {
            showAlert(alertBox, "err", "Password must be at least 8 characters.");
            return;
          }
          const result = await api("/api/auth/change-password", {
            method: "POST",
            body: JSON.stringify({ current_password: current, new_password: newPwd }),
          });
          if (result && result.message) {
            showAlert(alertBox, "ok", "Password changed.");
            document.getElementById("currentPassword").value = "";
            document.getElementById("newPassword").value = "";
          } else {
            showAlert(alertBox, "err", "Failed to change password.");
          }
        });

        document.getElementById("signOutBtn").addEventListener("click", () => {
          window.AriesSession.signOut();
        });

        loadProfile();
      })();
    </script>
  </body>
</html>
