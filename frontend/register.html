<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <img src="images/auth-observatory.jpg" alt="" />
        <div class="auth-visual-copy">
          <a class="logo" href="index.html">Aries</a>
          <h1>Open a workspace.</h1>
          <p>
            Register, then a short onboarding so the desk matches how your agency actually works.
          </p>
        </div>
      </aside>
      <main class="auth-panel">
        <header>
          <p class="kicker">Account</p>
          <h2>Create your account</h2>
          <p class="lede">
            Start with your account details. Aries will guide you through workspace setup next.
          </p>
        </header>
        <div role="status"></div>
        <div class="socials">
          <button class="social" type="button" data-provider="google">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#ea4335"
                d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.6-5.1 3.6-3.1 0-5.6-2.5-5.6-5.6S8.9 6.2 12 6.2c1.8 0 3 .7 3.7 1.4l2.5-2.4C16.7 3.7 14.6 2.7 12 2.7 6.9 2.7 2.7 6.9 2.7 12S6.9 21.3 12 21.3c5.5 0 9.1-3.9 9.1-9.3 0-.6 0-1-.1-1.8H12z"
              />
            </svg>
            Sign up with Google
          </button>
          <button class="social" type="button" data-provider="facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#1877f2"
                d="M14.5 8.5h2.2V5.4h-2.2C12.1 5.4 11 7 11 9.3V11H8.7v3.2H11V22h3.3v-7.8h2.3l.5-3.2H14.3V9.5c0-.6.2-1 .2-1z"
              />
            </svg>
            Sign up with Facebook
          </button>
        </div>
        <div class="divider">or email</div>
        <form id="registerForm">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="field">
            <label for="email">Work email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="row-2">
            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>
            <div class="field">
              <label for="confirm">Confirm</label>
              <input
                id="confirm"
                name="confirm"
                type="password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>
          </div>
          <button class="btn" type="submit">Create account</button>
        </form>
        <p class="note">Already have one? <a href="login.html">Sign in</a></p>
      </main>
    </div>
    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
