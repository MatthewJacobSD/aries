<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <img src="images/auth-desk.jpg" alt="" />
        <div class="auth-visual-copy">
          <a class="logo" href="index.html">Aries</a>
          <h1>Set a new password.</h1>
          <p>Choose something strong that you haven't used before.</p>
        </div>
      </aside>
      <main class="auth-panel">
        <header>
          <p class="kicker">Account recovery</p>
          <h2>Reset password</h2>
          <p class="lede">Enter the token from your email and your new password.</p>
        </header>
        <div id="authAlert" class="alert" role="status"></div>
        <form id="resetForm">
          <div class="field">
            <label for="token">Reset token</label>
            <input id="token" name="token" type="text" required />
          </div>
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required />
          </div>
          <button class="btn" type="submit">Reset password</button>
        </form>
        <p class="note">Remember your password? <a href="login.html">Sign in</a></p>
      </main>
    </div>
    <script>
      (function () {
        "use strict";
        const API_URL = "http://localhost:8000";
        const form = document.getElementById("resetForm");
        const alertBox = document.getElementById("authAlert");
        if (form) {
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = document.getElementById("token").value.trim();
            const password = document.getElementById("password").value;
            if (password.length < 8) {
              alertBox.className = "alert show err";
              alertBox.textContent = "Password must be at least 8 characters.";
              return;
            }
            try {
              const res = await fetch(`${API_URL}/api/auth/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, new_password: password }),
              });
              if (res.status === 200) {
                alertBox.className = "alert show ok";
                alertBox.textContent = "Password reset. Redirecting to sign in...";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
              } else {
                const data = await res.json();
                alertBox.className = "alert show err";
                alertBox.textContent = data.detail || "Reset failed.";
              }
            } catch {
              alertBox.className = "alert show err";
              alertBox.textContent = "Something went wrong. Try again.";
            }
          });
        }
      })();
    </script>
  </body>
</html>
