<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>
  <body class="app">
    <header class="site">
      <a class="logo" href="index.html">Aries</a>
      <nav class="primary" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="settings.html">Settings</a>
        <span id="authSlot"></span>
      </nav>
    </header>
    <div class="app-shell">
      <div class="dash">
        <aside class="dash-side">
          <div class="mark">ARIES</div>
          <nav class="dash-nav">
            <a class="dash-nav-link" href="dashboard.html">Overview</a>
            <a class="dash-nav-link" href="dashboard.html#devices">Devices</a>
            <button class="active" type="button">Device</button>
          </nav>
        </aside>
        <div class="dash-main detail-shell">
          <div id="loading" class="empty-state">
            <p>Loading device...</p>
          </div>
          <div id="content" style="display: none">
            <div class="detail-top">
              <div>
                <span class="kicker">Device record</span>
                <h1 id="device-name"></h1>
                <p id="device-desc" class="subhead"></p>
              </div>
              <span class="live-dot" id="device-status"></span>
            </div>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">At a glance</span>
                  <h3>Device information</h3>
                </div>
              </div>
              <div class="metrics" id="device-metrics"></div>
            </section>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">Details</span>
                  <h3>Device configuration</h3>
                </div>
              </div>
              <div class="table-wrap">
                <table class="ledger">
                  <thead>
                    <tr><th>Field</th><th>Value</th></tr>
                  </thead>
                  <tbody id="device-details"></tbody>
                </table>
              </div>
            </section>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">Logs</span>
                  <h3>Recent activity</h3>
                </div>
              </div>
              <div class="queue" id="device-logs"></div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script src="js/core.js"></script>
    <script src="js/session.js"></script>
    <script src="js/detail.js"></script>
    <script>
      (function () {
        "use strict";
        const { api, getParam, escapeHtml, showContent } = window.AriesDetail;
        const id = getParam("id");
        if (!id) {
          window.location.href = "dashboard.html#devices";
          return;
        }
        (async () => {
          const device = await api(`/api/devices/${id}`);
          if (!device) {
            document.getElementById("loading").innerHTML = "<p>Device not found.</p>";
            return;
          }
          document.getElementById("loading").style.display = "none";
          showContent("content");
          document.getElementById("device-name").textContent = device.name;
          document.getElementById("device-desc").textContent = `${device.platform} · ${device.serial}`;
          document.getElementById("device-status").textContent = device.status;
          document.getElementById("device-metrics").innerHTML = `<div class="metric"><span>Platform</span><strong>${escapeHtml(device.platform)}</strong></div><div class="metric"><span>Status</span><strong>${escapeHtml(device.status)}</strong></div>`;
          document.getElementById("device-details").innerHTML = `<tr><td>Serial</td><td class="mono">${escapeHtml(device.serial)}</td></tr><tr><td>Platform</td><td>${escapeHtml(device.platform)}</td></tr><tr><td>Creator</td><td>${device.creator_id ? device.creator_id.slice(0, 8) : "\u2014"}</td></tr>`;
          const logs = await api(`/api/devices/${id}/logs?limit=20`);
          if (logs && logs.logs && logs.logs.length > 0) {
            let html = "";
            logs.logs.forEach((l) => {
              html += `<div class="queue-item"><b>${escapeHtml(l.message || JSON.stringify(l))}</b><span>${escapeHtml(l.timestamp || "")}</span></div>`;
            });
            document.getElementById("device-logs").innerHTML = html;
          } else {
            document.getElementById("device-logs").innerHTML = "<div class='queue-item'><b>No logs yet</b><span>—</span></div>";
          }
          document.title = `${device.name} — Aries`;
        })();
      })();
    </script>
  </body>
</html>
