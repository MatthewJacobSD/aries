<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <img src="images/auth-desk.jpg" alt="" />
        <div class="auth-visual-copy">
          <a class="logo" href="index.html">Aries</a>
          <h1>Reset your password.</h1>
          <p>We'll send you a link to regain access to your workspace.</p>
        </div>
      </aside>
      <main class="auth-panel">
        <header>
          <p class="kicker">Account recovery</p>
          <h2>Forgot password</h2>
          <p class="lede">Enter your email and we'll send a reset link.</p>
        </header>
        <div id="authAlert" class="alert" role="status"></div>
        <form id="forgotForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <button class="btn" type="submit">Send reset link</button>
        </form>
        <p class="note">Remember your password? <a href="login.html">Sign in</a></p>
      </main>
    </div>
    <script>
      (function () {
        "use strict";
        const API_URL = "http://localhost:8000";
        const form = document.getElementById("forgotForm");
        const alertBox = document.getElementById("authAlert");
        if (form) {
          form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim().toLowerCase();
            try {
              const res = await fetch(`${API_URL}/api/auth/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email }),
              });
              const data = await res.json();
              alertBox.className = "alert show ok";
              alertBox.textContent = data.message || "If the email exists, a reset link has been sent.";
            } catch {
              alertBox.className = "alert show err";
              alertBox.textContent = "Something went wrong. Try again.";
            }
          });
        }
      })();
    </script>
  </body>
</html>
