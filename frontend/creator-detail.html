<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator — Aries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/aries.css" />
  </head>
  <body class="app">
    <header class="site">
      <a class="logo" href="index.html">Aries</a>
      <nav class="primary" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="settings.html">Settings</a>
        <span id="authSlot"></span>
      </nav>
    </header>
    <div class="app-shell">
      <div class="dash">
        <aside class="dash-side">
          <div class="mark">ARIES</div>
          <nav class="dash-nav">
            <a class="dash-nav-link" href="dashboard.html">Overview</a>
            <a class="dash-nav-link" href="dashboard.html#creators">Creators</a>
            <button class="active" type="button">Creator</button>
          </nav>
        </aside>
        <div class="dash-main detail-shell">
          <div id="loading" class="empty-state">
            <p>Loading creator...</p>
          </div>
          <div id="content" style="display: none">
            <div class="detail-top">
              <div>
                <span class="kicker">Creator record</span>
                <h1 id="creator-name"></h1>
                <p id="creator-desc" class="subhead"></p>
                <div class="creator-meta" id="creator-meta"></div>
              </div>
              <span class="live-dot" id="creator-status"></span>
            </div>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">At a glance</span>
                  <h3>Current position</h3>
                </div>
              </div>
              <div class="metrics" id="creator-metrics"></div>
            </section>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">Work</span>
                  <h3>Campaign activity</h3>
                </div>
                <a class="cta" href="dashboard.html#campaigns">View campaigns</a>
              </div>
              <div class="table-wrap">
                <table class="ledger">
                  <thead>
                    <tr><th>Campaign</th><th>Status</th><th>Value</th></tr>
                  </thead>
                  <tbody id="creator-campaigns"></tbody>
                </table>
              </div>
            </section>

            <section class="detail-section">
              <div class="detail-section-head">
                <div>
                  <span class="kicker">Financial</span>
                  <h3>Creator earnings</h3>
                </div>
                <a class="cta" href="dashboard.html#revenue">Open revenue</a>
              </div>
              <div class="metrics" id="creator-earnings"></div>
            </section>
          </div>
        </div>
      </div>
    </div>
    <script src="js/session.js"></script>
    <script src="js/detail.js"></script>
    <script>
      (function () {
        "use strict";
        const { api, getParam, escapeHtml, showContent } = window.AriesDetail;
        const id = getParam("id");
        if (!id) {
          window.location.href = "dashboard.html#creators";
          return;
        }
        (async () => {
          const creator = await api(`/api/creators/${id}`);
          if (!creator) {
            document.getElementById("loading").innerHTML = "<p>Creator not found.</p>";
            return;
          }
          document.getElementById("loading").style.display = "none";
          showContent("content");
          document.getElementById("creator-name").textContent = creator.name;
          document.getElementById("creator-desc").textContent = `${creator.platform} · ${creator.handle}`;
          document.getElementById("creator-status").textContent = creator.status;
          document.getElementById("creator-meta").innerHTML = `<span>${escapeHtml(creator.platform)}</span><span>${escapeHtml(creator.status)}</span><span class="mono">${escapeHtml(creator.id.slice(0, 12))}</span>`;
          document.getElementById("creator-metrics").innerHTML = `<div class="metric"><span>Revenue share</span><strong>${Math.round(creator.revenue_share * 100)}%</strong></div><div class="metric"><span>Platform</span><strong>${escapeHtml(creator.platform)}</strong></div>`;
          document.getElementById("creator-campaigns").innerHTML = "<tr><td colspan='3'>Campaign data loads from campaign API</td></tr>";
          document.getElementById("creator-earnings").innerHTML = "<div class='metric'><span>Earnings</span><strong>Load from revenue API</strong></div>";
          document.title = `${creator.name} — Aries`;
        })();
      })();
    </script>
  </body>
</html>
